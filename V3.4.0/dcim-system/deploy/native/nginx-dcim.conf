# 原生部署 nginx 站点：前端静态 + /api 反代到本机后端 8081
# 安装程序会把 @WEB_ROOT@ 替换为 artifacts/web/dist 的绝对路径。
# HTTPS：取消 443 段注释并填入证书路径（建议 80 → 443 跳转）。
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    root @WEB_ROOT@;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        # $http_host 保留端口：非 80/443 端口访问时 Origin 与 Host 才一致，否则 CORS 判为跨域 403
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖式写入：后端只信任可信代理传来的 XFF，客户端伪造的头被顶掉
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SSE 实时推送（v3.5）：精确匹配优先于 /api/ 前缀。
    # proxy_buffering off 关闭响应缓冲，心跳（25s :ping）与广播帧到达即转发；
    # HTTP/1.1 + 空 Connection 头保持长连接；读超时 24h（心跳每 25s 一次，天然保活）。
    location = /api/notifications/sse {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location ~* ^/assets/.+\.(js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 注意：location 内出现 add_header 会让 server 级的全部 add_header 失效，须重复声明
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

