# GPU 告警（NVIDIA dcgm-exporter 指标）
groups:
  - name: gpu
    rules:
      - alert: DcgmExporterDown
        expr: up{job="dcgm"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.asset_name }} GPU 指标采集失败（dcgm-exporter）"
          description: "{{ $labels.instance }} 无法访问，GPU 健康状态不可见。"
      - alert: GpuXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.asset_name }} GPU{{ $labels.gpu }} 出现 XID 错误 {{ $value }}"
          description: "XID 48/63/64/74/79 等通常意味着显存/NVLink/掉卡故障，建议隔离节点并报修。"
      - alert: GpuEccDoubleBit
        expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.asset_name }} GPU{{ $labels.gpu }} 出现不可纠正 ECC 错误"
          description: "双比特 ECC 错误会导致任务失败，需重启复位或更换 GPU。"
      - alert: GpuHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.asset_name }} GPU{{ $labels.gpu }} 温度 {{ $value }}℃"
          description: "持续 5 分钟高于 85℃，检查风扇 / 液冷 / 机柜进风。"
      - alert: GpuRowRemapFailure
        expr: DCGM_FI_DEV_ROW_REMAP_FAILURE > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.asset_name }} GPU{{ $labels.gpu }} 显存行重映射失败"
          description: "显存已无可用备用行，需更换 GPU。"
