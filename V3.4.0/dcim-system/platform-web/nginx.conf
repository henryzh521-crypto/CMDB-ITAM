# platform-web nginx 站点配置（SPA + 静态资源缓存）
# /api 与 /legacy 由入口 Caddy 分流，nginx 不处理、不代理
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA 路由回退：/login、/asset/... 等前端路由全部回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物（有扩展名）：长缓存；缺失必须 404，不能回退 HTML（避免 JS/CSS 拿到 index）
    # 注意 SPA 路由也有 /assets/inventory 等无扩展名路径，不能整目录 =404
    location ~* ^/assets/.+\.(js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /assets/ 下无扩展名 → SPA 路由（资产台账/分类/型号库等）
    location /assets/ {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        # 注意：location 内出现 add_header 会让 server 级的全部 add_header 失效，CSP 须重复声明
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # CSP 与后端部署（deploy/native/nginx-dcim.conf、Caddy）对齐：
    # script-src 'self'：Vite 产物为同源 module script，无内联/eval 依赖；
    # style-src 'unsafe-inline'：Element Plus / 运行时注入的样式需要；
    # img-src data:：二维码 dataURL 与 favicon；
    # connect-src 'self'：API/SSE 均为同源 /api 反代。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
